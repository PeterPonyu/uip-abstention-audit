# Landing-only Pages. No Eleventy companion. No page_build. No peaceiris.
name: Pages companion

on:
  push:
    branches: [main, pages/materials-companion]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail closed if landing carries thesis or result tokens
        run: |
          set -euo pipefail
          test -f pages-landing/index.html
          test -f pages-landing/404.html
          test -f pages-landing/landing.css
          if grep -ERi 'Thesis|unpublished results|12\.4%|256,963|256963|99\.7%|45 of 60|w2_daf|w4_error|w8_mechanism|paper_jcp|Journal of Chemical Physics|this paper|manuscript' pages-landing/; then
            echo 'pages-landing must stay a code description (no thesis / result tokens)' >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-landing

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
